<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Address retired</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f1efe8; color: #1c2024; }
  @media (prefers-color-scheme: dark) { body { background: #1f2329; color: #e2e0da; } }
  main { max-width: 32rem; padding: 2rem 16px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { margin: 0; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>This address is retired</h1>
  <p>Nothing is available here any more.</p>
</main>
<script>
  // Remove any old offline copy for this folder, in case the browser kept it without a running worker.
  (async () => {
    const scope = new URL("./", location.href).pathname;
    if ("serviceWorker" in navigator) {
      for (const reg of await navigator.serviceWorker.getRegistrations()) {
        if (new URL(reg.scope).pathname.startsWith(scope)) await reg.unregister();
      }
    }
    if ("caches" in window) {
      for (const name of await caches.keys()) {
        const cache = await caches.open(name);
        for (const req of await cache.keys()) if (new URL(req.url).pathname.startsWith(scope)) await cache.delete(req);
        if ((await cache.keys()).length === 0) await caches.delete(name);
      }
    }
  })().catch(() => {});
</script>
</body>
</html>
